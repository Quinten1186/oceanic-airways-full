<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Booking | Oceanic Airways</title>
    <style>
      :root {
        --navy: #0d2340;
        --blue: #2a7de1;
        --blue-2: #154d94;
        --gold: #f4c96b;
        --text: #12314e;
        --muted: #5b7288;
        --white: #ffffff;
        --border: rgba(18,49,78,0.08);
        --shadow: 0 22px 45px rgba(9,27,47,0.12);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #eef7ff;
        color: var(--text);
      }

      .container {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
      }

      .site-header {
        background: var(--navy);
        color: var(--white);
      }

      .nav-wrap {
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: 72px;
      }

      .brand {
        font-size: 1.2rem;
        font-weight: 700;
      }

      .main-nav {
        display: flex;
        gap: 18px;
      }

      .main-nav a {
        color: rgba(255,255,255,0.8);
        text-decoration: none;
      }

      .page-shell {
        padding: 42px 0 80px;
      }

      .panel {
        background: rgba(255,255,255,0.95);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: var(--shadow);
        padding: 22px;
      }

      .manage-form {
        display: grid;
        gap: 18px;
      }

      label {
        display: grid;
        gap: 8px;
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--muted);
      }

      input {
        width: 100%;
        min-height: 48px;
        border-radius: 12px;
        border: 1px solid rgba(18,49,78,0.12);
        background: #f7fbff;
        padding: 0 14px;
      }

      .btn {
        min-height: 52px;
        padding: 0 22px;
        border-radius: 12px;
        border: none;
        background: linear-gradient(135deg, var(--blue), var(--blue-2));
        color: var(--white);
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <div class="brand">✈️ Oceanic Airways</div>
        <nav class="main-nav">
          <a href="index.html">Home</a>
          <a href="search.html">Search Flights</a>
          <a href="manage.html">Manage Booking</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <main class="page-shell container">
      <section class="panel">
        <h1>Manage your booking</h1>

        <form id="manage-form" class="manage-form">
          <label>
            Booking reference
            <input type="text" id="bookingRefInput" required />
          </label>

          <label>
            Email address
            <input type="email" id="bookingEmailInput" required />
          </label>

          <button type="submit" class="btn">Find booking</button>
        </form>

        <div id="manage-result"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
