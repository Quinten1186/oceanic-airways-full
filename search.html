<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Flights | Oceanic Airways</title>
    <style>
      :root {
        --navy: #0d2340;
        --blue: #2a7de1;
        --blue-2: #154d94;
        --gold: #f4c96b;
        --text: #12314e;
        --muted: #5b7288;
        --white: #ffffff;
        --border: rgba(18,49,78,0.08);
        --shadow: 0 22px 45px rgba(9,27,47,0.12);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #eef7ff;
        color: var(--text);
      }

      .container {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
      }

      .site-header {
        background: var(--navy);
        color: var(--white);
      }

      .nav-wrap {
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: 72px;
      }

      .brand {
        font-size: 1.2rem;
        font-weight: 700;
      }

      .main-nav {
        display: flex;
        gap: 18px;
      }

      .main-nav a {
        color: rgba(255,255,255,0.8);
        text-decoration: none;
      }

      .page-shell {
        padding: 40px 0;
      }

      .panel {
        background: rgba(255,255,255,0.95);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: var(--shadow);
        padding: 22px;
      }

      .flight-form {
        display: grid;
        gap: 18px;
      }

      .field-grid {
        display: grid;
        gap: 16px;
      }

      .five-col {
        grid-template-columns: repeat(5, minmax(120px, 1fr));
      }

      label {
        display: grid;
        gap: 8px;
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--muted);
      }

      input, select {
        width: 100%;
        min-height: 48px;
        border-radius: 12px;
        border: 1px solid rgba(18,49,78,0.12);
        background: #f7fbff;
        padding: 0 14px;
      }

      .btn {
        min-height: 52px;
        padding: 0 22px;
        border-radius: 12px;
        border: none;
        background: linear-gradient(135deg, var(--blue), var(--blue-2));
        color: var(--white);
        font-weight: 700;
        cursor: pointer;
      }

      .flight-results {
        display: grid;
        gap: 16px;
        margin-top: 20px;
      }

      .flight-card {
        display: grid;
        grid-template-columns: 1.5fr 1fr auto;
        gap: 18px;
        align-items: center;
        padding: 18px;
        background: #f7fbff;
        border: 1px solid var(--border);
        border-radius: 16px;
      }

      .flight-route {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .airport-block {
        display: grid;
        gap: 6px;
      }

      .airport-block strong {
        font-size: 1.4rem;
      }

      .route-line {
        width: 120px;
        text-align: center;
        color: var(--muted);
      }

      .line {
        height: 2px;
        background: rgba(18,49,78,0.2);
        margin-top: 6px;
      }

      .flight-price {
        text-align: right;
      }

      .flight-price strong {
        display: block;
        font-size: 1.8rem;
        margin-bottom: 10px;
      }

      @media (max-width: 860px) {
        .five-col { grid-template-columns: 1fr; }
        .flight-card { grid-template-columns: 1fr; }
      }
    </style>
  </head>

  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <div class="brand">✈️ Oceanic Airways</div>
        <nav class="main-nav">
          <a href="index.html">Home</a>
          <a href="search.html">Search Flights</a>
          <a href="manage.html">Manage Booking</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <main class="page-shell container">
      <section class="panel">
        <h1>Choose your route</h1>

        <form id="search-form" class="flight-form">
          <div class="field-grid five-col">
            <label>
              From
              <select name="from" required>
                <option value="BNE">Brisbane (BNE)</option>
                <option value="SYD">Sydney (SYD)</option>
                <option value="MEL">Melbourne (MEL)</option>
                <option value="PER">Perth (PER)</option>
                <option value="SIN">Singapore (SIN)</option>
                <option value="DXB">Dubai (DXB)</option>
                <option value="LAX">Los Angeles (LAX)</option>
                <option value="HKG">Hong Kong (HKG)</option>
              </select>
            </label>

            <label>
              To
              <select name="to" required>
                <option value="SYD">Sydney (SYD)</option>
                <option value="BNE">Brisbane (BNE)</option>
                <option value="MEL">Melbourne (MEL)</option>
                <option value="PER">Perth (PER)</option>
                <option value="SIN">Singapore (SIN)</option>
                <option value="DXB">Dubai (DXB)</option>
                <option value="LAX">Los Angeles (LAX)</option>
                <option value="HKG">Hong Kong (HKG)</option>
              </select>
            </label>

            <label>
              Depart
              <input type="date" name="depart" required />
            </label>

            <label>
              Return
              <input type="date" name="return" />
            </label>

            <label>
              Travelers
              <select name="passengers">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
              </select>
            </label>
          </div>

          <button type="submit" class="btn">Update results</button>
        </form>
      </section>

      <section class="panel">
        <h2>Available flights</h2>
        <div id="results-meta">Loading...</div>
        <div id="flight-results" class="flight-results"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
